# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Hillside 46
  #   Comment out below if you do not have this board, to save build time
  - board: nice_nano//zmk
    shield: hillside46_left
  - board: nice_nano//zmk
    shield: hillside46_right
  # Second keyboard ("B"): distinct BLE name so the host can tell the two
  # boards apart, plus higher TX power for a more stable link.
  # Only the left (central) half advertises the name; the right half
  # gets its own build just for the TX power boost.
  - board: nice_nano//zmk
    shield: hillside46_left
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Hillside46-B\" -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: hillside46_B_left
  - board: nice_nano//zmk
    shield: hillside46_right
    cmake-args: -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    artifact-name: hillside46_B_right
